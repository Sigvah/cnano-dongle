# Wafer branch: builds only the Wafer halves.
# The other keyboards (charybdis, forager, visorbearer, dongle) are built from main.
include:
  - board: wafer_left
  - board: wafer_right

  # Flash these once to clear stored bonds on a half, then flash the normal firmware.
  - board: wafer_left
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y
    artifact-name: wafer_left_settings_reset
  - board: wafer_right
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y
    artifact-name: wafer_right_settings_reset
